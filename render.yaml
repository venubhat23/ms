services:
  - type: web
    name: drwise-admin
    runtime: ruby
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec rails server -p $PORT -e production
    envVars:
      - key: RUBY_VERSION
        value: 3.2.0
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: true
      - key: RAILS_LOG_TO_STDOUT
        value: true
      # Runs the Solid Queue supervisor inside this same Puma process (see
      # config/puma.rb) since there's no separate worker service defined here.
      # Without it, nothing executes config/recurring.yml's production jobs
      # (warm_dashboard_cache, clear_solid_queue_finished_jobs) or any other
      # background job.
      - key: SOLID_QUEUE_IN_PUMA
        value: true